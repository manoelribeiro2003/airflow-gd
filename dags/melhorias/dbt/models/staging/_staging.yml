version: 2

models:
  - name: stg_mel_ganhos
    description: >
      Limpeza 1:1 sobre o bronze mel_ganhos + union all com mel_ganhos_hist (FAPs
      aprovadas cujo ganho só existe nas planilhas do Qlik, ADR 0008). Grão:
      componente (uma linha por Id / cod_prod da FAP). dt_fap nativo; bimestre
      canônico via seed mel_bimestre. Nas FAPs do seed mel_ganhos_ajuste, o
      ganho_previsto do bronze é trocado pelo valor da planilha (ADR 0011).
      macro_setor nulo é preenchido pelo seed mel_macro_setor (ADR 0012). As FAPs do
      seed mel_ganhos_fonte_planilha saem do bronze e entram pelas linhas da planilha
      em mel_ganhos_hist, com os atributos da FAP do bronze (ADR 0013).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fonte, id]
    columns:
      - name: fonte
        description: >
          De onde veio a linha: 'bronze' (mel_ganhos) ou 'hist' (mel_ganhos_hist).
          Uma FAP nunca está nas duas (teste assert_mel_ganhos_hist_disjunto); as de
          mel_ganhos_fonte_planilha ficam só no 'hist'.
        data_tests:
          - not_null
          - accepted_values:
              values: [bronze, hist]
      - name: id
        description: >
          PK do componente na fonte da linha (mel_ganhos.id ou mel_ganhos_hist.id);
          único junto com fonte.
        data_tests: [not_null]
      - name: numero_fap
        description: >
          Número da FAP. É um número composto por `id_setor` + `id_tipo_fap`
          + `year(date)` + `month(date)` + `day(date)` + qtde numero_fap gerados em date + 1.
          Exemplo: `272102026060401` -> `272-10-2026-06-04-01`.
          Esse número é único e é gerado pelo app em de melhorias no power apps.
          `id_setor` e `id_tipo_fap` vem de listas no sharepoint, não mapeamos para SQL Server.
      - name: tipo_melhoria
        description: "Tipo da melhoria (TC, Consumo, Troca MP, Aglutinação, etc.)."
      - name: dt_fap
        description: "Data da FAP (data mestra, ADR 0003)."
      - name: bimestre
        description: "Bimestre canônico 'mes1-mes2/ano' derivado de dt_fap."
      - name: cracha_idealizador
        description: "Crachá do idealizador."

  - name: stg_mel_volume_real
    description: >
      Limpeza 1:1 sobre mel_volume_real (volume real por melhoria). Grão
      (numero_fap, cod_prod, mes_ano). Substitui o volume estimado volume_mes_* no
      cálculo de ganhos (int_ganhos_calc).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [numero_fap, cod_prod, mes_ano]
    columns:
      - name: numero_fap
        description: "Número da FAP. Parte da chave de volume."
        data_tests: [not_null]
      - name: cod_prod
        description: "Código do produto/componente. Parte da chave de volume."
        data_tests: [not_null]
      - name: mes_ano
        description: "Mês/ano canônico 'MM/YYYY'. Parte da chave de volume."
        data_tests: [not_null]
      - name: volume
        description: "Volume real de produção somado por local na janela do mês."

  - name: stg_mel_volume_real_hist
    description: >
      Limpeza 1:1 sobre mel_volume_real_hist (volume real das planilhas do Qlik,
      2021-2025). Grão (numero_fap, cod_prod, mes_offset). Fonte do volume real em
      int_ganhos_calc quando o mês de competência é anterior a volume_hist_ate
      (ADR 0007).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [numero_fap, cod_prod, mes_offset]
    columns:
      - name: numero_fap
        description: "Número da FAP. Parte da chave de volume."
        data_tests: [not_null]
      - name: cod_prod
        description: >
          Código do produto/componente sem zeros à esquerda (o Excel guarda como
          número). Parte da chave de volume.
        data_tests: [not_null]
      - name: mes_offset
        description: >
          Mês a partir de dt_fap: 1 = mês de dt_fap (arquivo normal), 2 = mês
          seguinte (arquivo mês.anterior). Parte da chave de volume.
        data_tests:
          - not_null
          - accepted_values:
              values: [1, 2]
              quote: false
      - name: volume
        description: "Volume real do mês (coluna '1º Mês' da planilha)."
        data_tests: [not_null]
      - name: arquivo_origem
        description: "Planilha de onde veio a linha (auditoria)."

  - name: stg_mel_aprovacao
    description: >
      Limpeza 1:1 sobre o bronze mel_aprovacao. Deriva dt_fap (data mestra, ADR 0003)
      e bimestre canônico. Fonte do pipeline de não-aprovadas e atributos de fluxo.
    columns:
      - name: id
        description: "PK da linha em mel_aprovacao."
        data_tests: [unique, not_null]
      - name: numero_fap
        description: >
          Número da FAP. É um número composto por `id_setor` + `id_tipo_fap`
          + `year(date)` + `month(date)` + `day(date)` + qtde numero_fap gerados em date + 1.
          Exemplo: `272102026060401` -> `272-10-2026-06-04-01`.
          Esse número é único e é gerado pelo app em de melhorias no power apps.
          `id_setor` e `id_tipo_fap` vem de listas no sharepoint, não mapeamos para SQL Server.
          Único: int_ganhos_long filtra aprovadas com join por numero_fap.
        data_tests: [unique]
      - name: status
        description: "Status no fluxo de aprovação."
      - name: dt_fap
        description: "Data da FAP derivada (coalesce dt_fap / dt_aprovacao_eng)."
      - name: bimestre
        description: "Bimestre canônico 'mes1-mes2/ano' derivado de dt_fap."
      - name: cracha_idealizador
        description: "Crachá do idealizador."

  - name: stg_meta_aderencia
    description: >
      Limpeza 1:1 sobre mel_meta_aderencia (tabela CENTRAL). Grão (bimestre, codigo).
      Deriva flag elegivel e bimestre canônico; preserva bimestre_origem.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [bimestre, codigo]
    columns:
      - name: bimestre
        description: "Bimestre canônico 'mes1-mes2/ano'. Parte da PK composta."
        data_tests: [not_null]
      - name: bimestre_origem
        description: "Bimestre original da fonte, antes da canonicalização."
      - name: codigo
        description: "Crachá (código RH) do funcionário. Parte da PK composta."
        data_tests: [not_null]
      - name: gerente_meta
        description: "Gerente responsável pela meta."
      - name: grupo_cargo
        description: "Grupo de cargo (regra de elegibilidade)."
      - name: qtde
        description: "Meta fixa: 1 melhoria por elegível/bimestre."
      - name: elegivel
        description: "Flag (bit): grupo_cargo elegível E categoria 'Considera'."

  - name: stg_carga_horaria
    description: >
      Limpeza 1:1 sobre mel_carga_horaria (horas trabalhadas mensais por setor).
      Usada na conversão de horas ganhas para R$ (int_ganhos_long).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [mes, setor]
    columns:
      - name: mes
        description: "Mês de referência. Parte da PK composta."
        data_tests: [not_null]
      - name: setor
        description: "Setor. Parte da PK composta."
        data_tests: [not_null]
      - name: ch_mensal
        description: "Carga horária mensal (horas) do setor."

  - name: stg_carga_horaria_macro
    description: >
      Limpeza 1:1 sobre mel_carga_horaria_macro (horas trabalhadas mensais por
      estabelecimento + macro setor, planilha carga_horaria.xlsx do Qlik). Chave do
      Qlik: estabelecimento|Area|mes ano. Fallback/histórico da carga por setor em
      int_ganhos_calc (ADR 0006).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [estabelecimento, area, mes]
    columns:
      - name: estabelecimento
        description: "Estabelecimento (casa com mel_ganhos.filial). Parte da PK composta."
        data_tests: [not_null]
      - name: area
        description: "Macro setor (casa com mel_ganhos.macro_setor). Parte da PK composta."
        data_tests: [not_null]
      - name: mes
        description: "Mês de referência (primeiro dia). Parte da PK composta."
        data_tests: [not_null]
      - name: ch_mensal
        description: "Carga horária mensal (horas/funcionário) do macro setor."
        data_tests: [not_null]

  - name: stg_custo_funcionario
    description: >
      Limpeza 1:1 sobre mel_custo_funcionario (custo mensal por estabelecimento).
      Usado na conversão de horas ganhas para R$ (int_ganhos_long).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [dt_competencia, estabelecimento]
    columns:
      - name: mes_ano
        description: "Mês/ano textual de referência."
      - name: dt_competencia
        description: "Data de competência. Parte da PK composta."
        data_tests: [not_null]
      - name: estabelecimento
        description: "Estabelecimento/filial. Parte da PK composta."
        data_tests: [not_null]
      - name: custo
        description: "Custo do funcionário no mês/estabelecimento (R$)."
